name: Truelli
description: >-
  Truelli is a health-technology company (a 500 Global portfolio company) behind
  a non-invasive menstrual health-screening product: a menstrual pad that also
  functions as a diagnostic device. A user wears the pad, scans a barcode with the
  Truelli mobile app, and receives instant screening results across general,
  hormonal, sexual, and metabolic health — spanning indicators such as anemia and
  fatigue, fertility and perimenopause, STIs and cancer risk, and diabetes and
  cardiovascular markers. The company emphasizes UKAS lab accreditation, HIPAA
  compliance, and clinical-trial validation. Truelli is a consumer product with no
  public developer API, SDK, or developer portal at this time.
